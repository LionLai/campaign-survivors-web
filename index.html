<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#171c2b">
    <title>選戰倖存者</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #171c2b; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; color: #fff; }
      #unity-container { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #171c2b; }
      #unity-container.unity-mobile { left: 0; top: 0; width: 100%; height: 100%; transform: none; }
      #unity-canvas { width: 100%; height: 100%; background: #171c2b; display: block; }
      /* 載入畫面：主視覺鋪底、下方深色漸層、標題與進度條 */
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; background: #171c2b url("loading.jpg") center / cover no-repeat; }
      #loading::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 55%; background: linear-gradient(to top, rgba(10,12,20,0.95) 0%, rgba(10,12,20,0.6) 55%, rgba(10,12,20,0) 100%); }
      #loading .inner { position: relative; z-index: 1; width: 78%; max-width: 420px; padding-bottom: 14vh; text-align: center; }
      #loading h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: 2px; color: #ffd54a; text-shadow: 0 2px 0 #171c2b, 0 0 14px rgba(0,0,0,0.6); }
      #loading .sub { margin: 0 0 22px; font-size: 15px; color: rgba(255,255,255,0.85); }
      #bar { height: 16px; border-radius: 10px; background: rgba(0,0,0,0.55); border: 2px solid #ffd54a; overflow: hidden; box-shadow: 0 2px 0 rgba(0,0,0,0.5); }
      #bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb84a, #ffd54a); transition: width 0.15s; }
      #pct { margin-top: 10px; font-size: 14px; color: rgba(255,255,255,0.75); }
      #hint { margin-top: 18px; font-size: 12px; color: rgba(255,255,255,0.5); }
      #warning { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: #e04040; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; display: none; z-index: 2; }
      #loading.done { display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div class="inner">
          <h1>選戰倖存者</h1>
          <div class="sub">撐到開票 · 開發測試版</div>
          <div id="bar"><div id="bar-fill"></div></div>
          <div id="pct">載入中 0%</div>
          <div id="hint">第一次載入約 35 MB，請稍候</div>
        </div>
      </div>
      <div id="warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var barFill = document.querySelector("#bar-fill");
      var pct = document.querySelector("#pct");
      var warningBanner = document.querySelector("#warning");
      var BUILD_VERSION = "202611011248";
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebRelease.loader.js?v=" + BUILD_VERSION;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebRelease.data.unityweb?v=" + BUILD_VERSION,
        frameworkUrl: buildUrl + "/WebRelease.framework.js.unityweb?v=" + BUILD_VERSION,
        codeUrl: buildUrl + "/WebRelease.wasm.unityweb?v=" + BUILD_VERSION,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "taiwanPgame",
        productName: "選戰倖存者",
        productVersion: "202611011248",
        showBanner: function (msg, type) {
          warningBanner.style.display = "block";
          warningBanner.textContent = msg;
          if (type !== "error") setTimeout(function () { warningBanner.style.display = "none"; }, 5000);
        },
      };
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        container.className = "unity-mobile";
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 3);   // iPhone 為 3 倍，2 倍時字與圖偏軟
      } else {
        // 桌面：9:16 直式畫布，高度佔滿視窗
        var fitPortrait = function () {
          var h = Math.max(480, window.innerHeight - 24);
          var w = Math.round(h * 9 / 16);
          if (w > window.innerWidth - 16) { w = window.innerWidth - 16; h = Math.round(w * 16 / 9); }
          container.style.width = w + "px";
          container.style.height = h + "px";
        };
        fitPortrait();
        window.addEventListener("resize", fitPortrait);
      }
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var p = Math.round(progress * 100);
          barFill.style.width = p + "%";
          pct.textContent = "載入中 " + p + "%";
        }).then(function (unityInstance) {
          loading.className = "done";
        }).catch(function (message) {
          pct.textContent = "載入失敗：" + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
